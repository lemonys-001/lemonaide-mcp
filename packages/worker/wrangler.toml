name = "lemonaide-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# ---------------------------------------------------------------------------
# Environments
#
# Wrangler does NOT inherit top-level bindings into named environments, so the
# full binding set is repeated under [env.production.*] below.
# ---------------------------------------------------------------------------
[vars]
# Public configuration (safe to expose). Secrets are set with `wrangler secret put`.
APP_BASE_DOMAIN = "localhost:8787"
MCP_PUBLIC_URL = "http://localhost:8787/mcp"
ENVIRONMENT = "development"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "396cc35e40a84e57b5345650744174aa"
preview_id = "396cc35e40a84e57b5345650744174aa"

[[kv_namespaces]]
binding = "BLOB_STORE"
id = "f16f9b8ff6f34ce0bfb4c79c0128172e"

[[queues.producers]]
binding = "BUILD_QUEUE"
queue = "lemonaide-builds"

[[queues.consumers]]
queue = "lemonaide-builds"
max_retries = 2
max_concurrency = 5

# Dashboard is served as Worker static assets (mounted from the dashboard build).
# Worker fetch() runs first for EVERY request — index.ts explicitly delegates to
# env.DASHBOARD for dashboard routes, so assets never shadow published apps.
[assets]
directory = "../dashboard/dist"
binding = "DASHBOARD"
not_found_handling = "single-page-application"
run_worker_first = true

# --- production -------------------------------------------------------------
[env.production]
name = "lemonaide-mcp"

[env.production.vars]
APP_BASE_DOMAIN = "lemonaide-mcp.lemonys.workers.dev"
MCP_PUBLIC_URL = "https://lemonaide-mcp.lemonys.workers.dev/mcp"
ENVIRONMENT = "production"

[[env.production.kv_namespaces]]
binding = "OAUTH_KV"
id = "396cc35e40a84e57b5345650744174aa"
preview_id = "396cc35e40a84e57b5345650744174aa"

[[env.production.kv_namespaces]]
binding = "BLOB_STORE"
id = "f16f9b8ff6f34ce0bfb4c79c0128172e"

[[env.production.queues.producers]]
binding = "BUILD_QUEUE"
queue = "lemonaide-builds"

[[env.production.queues.consumers]]
queue = "lemonaide-builds"
max_retries = 2
max_concurrency = 5

[env.production.assets]
directory = "../dashboard/dist"
binding = "DASHBOARD"
not_found_handling = "single-page-application"
run_worker_first = true

# ---------------------------------------------------------------------------
# Secrets (set via `wrangler secret put NAME` — see docs/SETUP.md):
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
#   GITHUB_APP_ID, GITHUB_APP_CLIENT_ID, GITHUB_APP_CLIENT_SECRET,
#   GITHUB_APP_PRIVATE_KEY, GITHUB_APP_WEBHOOK_SECRET,
#   BUILD_RUNNER_TOKEN, SESSION_SECRET
# ---------------------------------------------------------------------------
