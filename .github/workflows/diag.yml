name: diag
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: collect
        run: |
          exec 2>&1
          set +e
          { echo "node=$(node -v) npm=$(npm -v) arch=$(uname -m)"
            echo "=== npm ci"; npm ci --no-audit --no-fund 2>&1 | tail -30; echo "ci_exit=$?"
            echo "=== ls rollup"; ls node_modules/@rollup 2>&1
            echo "=== lint"; npm run lint 2>&1 | tail -15; echo "lint_exit=$?"
            echo "=== typecheck"; npm run typecheck 2>&1 | tail -15; echo "tc_exit=$?"
            echo "=== test"; npm run test 2>&1 | tail -30; echo "test_exit=$?"
          } > /tmp/out.txt
          head -c 60000 /tmp/out.txt > /tmp/small.txt
          jq -Rs '{body: .}' /tmp/small.txt > /tmp/body.json
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -X POST --input /tmp/body.json || true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cat /tmp/out.txt
