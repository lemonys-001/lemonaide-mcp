name: reset-prod
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET-PROD to confirm the full production wipe'
        required: true
      keep_github_app:
        description: 'Keep ghapp:* KV keys (GitHub App config)'
        type: boolean
        default: true

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Wipe production data
        env:
          CONFIRM: ${{ inputs.confirm }}
          KEEP_GITHUB_APP: ${{ inputs.keep_github_app }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/reset-prod.sh
