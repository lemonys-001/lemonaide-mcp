name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  deploy-worker:
    # Set repository variable ENABLE_CLOUDFLARE_DEPLOY=true after adding the
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets (docs/SETUP.md).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_CLOUDFLARE_DEPLOY == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build dashboard
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build -w @lemonaide/dashboard
      - name: Sync worker secrets from repo secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          BUILD_RUNNER_TOKEN: ${{ secrets.BUILD_RUNNER_TOKEN }}
          GITHUB_APP_ID: ${{ secrets.CF_GITHUB_APP_ID }}
          GITHUB_APP_CLIENT_ID: ${{ secrets.CF_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.CF_GITHUB_APP_CLIENT_SECRET }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CF_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_SLUG: ${{ secrets.CF_GITHUB_APP_SLUG }}
          GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.CF_GITHUB_APP_WEBHOOK_SECRET }}
          BUILD_DISPATCH_TOKEN: ${{ secrets.BUILD_DISPATCH_TOKEN }}
        run: bash scripts/sync-secrets.sh
      - name: Deploy worker (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy -w @lemonaide/worker -- --env production
